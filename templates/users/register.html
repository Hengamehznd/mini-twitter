{% load static %}
<!doctype html>
<html lang="fa" dir="rtl">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>ثبت نام | پرنده</title>
    <link
      rel="stylesheet"
      href="https://lib.arvancloud.ir/bootstrap/5.3.0-alpha1/css/bootstrap.min.css"
    />
    <link rel="stylesheet" href="{% static 'css/style.css' %}" />
    <script
      defer
      src="https://lib.arvancloud.ir/feather-icons/4.9.0/feather.min.js"
    ></script>
  </head>
  <body class="auth-page">
    <header class="topbar">
      <div
        class="container app-container d-flex align-items-center justify-content-between"
      >
        <a class="brand" href="index.html"
          ><span class="brand-mark"><i data-feather="twitter"></i></span
          ><span>پرنده</span></a
        >
        <div class="auth-links">
          <a class="btn btn-outline-primary btn-sm" href="{% url 'login' %}"
            >ورود</a
          ><a class="btn btn-primary btn-sm" href="{% url 'register' %}"
            >ثبت نام</a
          >
        </div>
      </div>
    </header>
    <main class="container app-container">
      <section class="auth-wrap">
        <div class="auth-card panel">
          <div class="auth-logo"><i data-feather="twitter"></i></div>
          <h1>به پرنده بپیوند!</h1>
          <p class="muted">همین امروز حساب خودت را بساز.</p>
          <form method="post">
            {% csrf_token %}
            <div class="mb-3">
              <label class="form-label" for="fullname">نام نمایشی</label
              ><input
                class="form-control"
                id="fullname"
                name="fullname"
                type="text"
                placeholder="نام شما"
              />
            </div>
            <div class="mb-3">
              <label class="form-label" for="signup-email">ایمیل</label
              ><input
                class="form-control"
                id="signup-email"
                name="email"
                type="email"
                placeholder="name@example.com"
              />
            </div>
            <div class="mb-3">
              <label class="form-label" for="username">نام کاربری</label
              ><input
                class="form-control"
                id="username"
                name="username"
                type="text"
                placeholder="نام کاربری دلخواه"
              />
            </div>
            <div class="mb-3">
              <label class="form-label" for="signup-password">رمز عبور</label
              ><input
                class="form-control"
                id="signup-password"
                name="password"
                type="password"
                placeholder="رمز عبور"
              />
            </div>
            <div class="mb-3">
              <label class="form-label" for="password-confirm"
                >تکرار رمز عبور</label
              ><input
                class="form-control"
                id="password-confirm"
                name="password_confirm"
                type="password"
                placeholder="رمز عبور را دوباره وارد کن"
              />
            </div>
            <button class="btn btn-primary w-100 auth-submit" type="submit">
              ثبت نام
            </button>
          </form>
          <p class="auth-switch">حساب داری؟ <a href="login.html">وارد شو</a></p>
        </div>
      </section>
    </main>
    <script>
      document.addEventListener("DOMContentLoaded", function () {
        if (window.feather) feather.replace();
      });
    </script>
  </body>
</html>
